<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ponto - Autenticação</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <section id="tela-login" class="secao-tela">
                    <div class="text-center">
                        <h2 class="titulo-login">REGISTRO DE PONTO -<br>AUTENTICAÇÃO</h2>
                    </div>
                    
                    <div id="alerta-erro" class="alert alert-danger d-none align-items-center rounded-4 mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div>Usuário ou senha incorretos!</div>
                    </div>

                    <form id="form-login" novalidate class="d-grid gap-4">
                        <div class="grupo-input-custom">
                            <div class="icone-capsula">
                                <i class="bi bi-person"></i>
                            </div>
                            <input type="text" class="input-invisivel" id="usuario" placeholder="Usuário" required>
                        </div>

                        <div class="grupo-input-custom flex-row-reverse">
                            <div class="icone-capsula">
                                <i class="bi bi-lock"></i>
                            </div>
                            <input type="password" class="input-invisivel" id="senha" placeholder="Senha" required>
                        </div>

                        <button type="submit" class="btn btn-autenticar shadow">
                            Autenticar
                        </button>
                    </form>
                </section>

                <section id="tela-ponto" class="secao-tela card-custom-ponto p-4">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                        <div class="d-flex align-items-center">
                            <div class="position-relative me-3">
                                <div class="bg-success-subtle p-2.5 rounded-circle text-success">
                                    <i class="bi bi-person-bounding-box fs-4"></i>
                                </div>
                                <span class="position-absolute bottom-0 end-0 p-1 bg-success border border-white rounded-circle"></span>
                            </div>
                            <div>
                                <h4 class="h6 fw-bold mb-0 text-dark">Caio Fischer</h4>
                                <span class="text-muted" style="font-size: 0.75rem;">CPF: 123.***.***-00</span>
                            </div>
                        </div>
                        <button onclick="ServicoAutenticacao.logout()" class="btn btn-sm btn-outline-secondary rounded-2">
                            <i class="bi bi-box-arrow-right me-1"></i> Sair
                        </button>
                    </div>

                    <div class="painel-relogio p-4 text-center mb-4">
                        <p class="text-uppercase tracking-widest text-white-50 small fw-bold mb-1">Horário Oficial do Servidor</p>
                        <div id="relogio" class="display-5 font-monospace fw-bold my-1">00:00:00</div>
                        <p id="data-atual" class="small opacity-70 mb-0 font-monospace text-capitalize"></p>
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <button id="btn-entrada" onclick="registrarPonto('ENTRADA')" class="btn btn-success w-100 py-3 fw-bold rounded-3 d-flex flex-column align-items-center gap-1 shadow-sm">
                                <i class="bi bi-play-circle fs-3"></i>
                                <span>Entrada</span>
                            </button>
                        </div>
                        <div class="col-6">
                            <button id="btn-saida" onclick="registrarPonto('SAÍDA')" class="btn btn-secondary w-100 py-3 fw-bold rounded-3 d-flex flex-column align-items-center gap-1" disabled>
                                <i class="bi bi-stop-circle fs-3"></i>
                                <span>Saída</span>
                            </button>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="form-label text-secondary small fw-bold mb-2">EVIDÊNCIA DE REGISTRO (TRILHA DE SESSÃO)</label>
                        <div id="console-ponto" class="log-terminal small d-flex align-items-center justify-content-center" style="min-height: 56px;">
                            <span class="text-muted opacity-50 font-monospace text-center"><i class="bi bi-hourglass-split me-1"></i> Aguardando comando...</span>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>
</body>
</html>
