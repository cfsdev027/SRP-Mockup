<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ponto - Autenticação</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <section id="tela-login" class="secao-tela">
                    <div class="text-center">
                        <h2 class="titulo-login">REGISTRO DE PONTO -<br>AUTENTICAÇÃO</h2>
                    </div>
                    
                    <div id="alerta-erro" class="alert alert-danger d-none align-items-center rounded-4 mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div>Usuário ou senha incorretos!</div>
                    </div>

                    <form id="form-login" novalidate class="d-grid gap-4">
                        <div class="grupo-input-custom">
                            <div class="icone-capsula">
                                <i class="bi bi-person"></i>
                            </div>
                            <input type="text" class="input-invisivel" id="usuario" placeholder="Usuário" required>
                        </div>

                        <div class="grupo-input-custom flex-row-reverse">
                            <div class="icone-capsula">
                                <i class="bi bi-lock"></i>
                            </div>
                            <input type="password" class="input-invisivel" id="senha" placeholder="Senha" required>
                        </div>

                        <button type="submit" class="btn btn-autenticar shadow">
                            Autenticar
                        </button>
                    </form>
                </section>

                <section id="tela-ponto" class="secao-tela card-custom-ponto p-4" style="background: #ffffff; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
                    
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                        <div class="d-flex align-items-center">
                            <div class="position-relative me-3">
                                <div class="bg-success-subtle p-2 rounded-circle text-success" style="padding: 10px !important;">
                                    <i class="bi bi-person-bounding-box fs-4"></i>
                                </div>
                                <span class="position-absolute bottom-0 end-0 p-1 bg-success border border-white rounded-circle"></span>
                            </div>
                            <div>
                                <h4 class="h6 fw-bold mb-0" style="color: #1e293b;">Caio Fischer</h4>
                                <span class="text-muted" style="font-size: 0.85rem; letter-spacing: 0.5px;">CPF: 123.***.***-00</span>
                            </div>
                        </div>
                        <button onclick="ServicoAutenticacao.logout()" class="btn btn-sm btn-light rounded-3 fw-semibold text-secondary px-3" style="background: #f1f5f9; border: none;">
                            <i class="bi bi-box-arrow-right me-1"></i> Sair
                        </button>
                    </div>

                    <div class="painel-relogio p-4 text-center mb-4" style="background: #0f172a; border-radius: 16px; color: #ffffff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);">
                        <p class="text-uppercase small fw-bold mb-1" style="font-size: 0.75rem; letter-spacing: 1.5px; color: #94a3b8;">Horário Oficial do Servidor</p>
                        <div id="relogio" class="display-6 font-monospace fw-bold my-1" style="color: #f8fafc; font-feature-settings: 'tnum';">00:00:00</div>
                        <p id="data-atual" class="small mb-0 text-capitalize" style="color: #94a3b8; font-size: 0.85rem;"></p>
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <button id="btn-entrada" onclick="registrarPonto('ENTRADA')" class="btn btn-success w-100 py-3 fw-bold rounded-3 d-flex flex-column align-items-center gap-1 shadow-sm" style="background: #0f766e; border: none;">
                                <i class="bi bi-play-fill fs-3"></i>
                                <span>Entrada</span>
                            </button>
                        </div>
                        <div class="col-6">
                            <button id="btn-saida" onclick="registrarPonto('SAÍDA')" class="btn btn-secondary w-100 py-3 fw-bold rounded-3 d-flex flex-column align-items-center gap-1" style="background: #f8fafc; color: #1e293b; border: 1px solid #e2e8f0;" disabled>
                                <i class="bi bi-stop-fill fs-3"></i>
                                <span>Saída</span>
                            </button>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="form-label text-uppercase small fw-bold mb-2" style="font-size: 0.75rem; color: #64748b; letter-spacing: 1px;">EVIDÊNCIA DE REGISTRO (TRILHA DE SESSÃO)</label>
                        <div id="console-ponto" class="log-terminal small d-flex flex-column gap-2 p-3 text-start" style="min-height: 70px; max-height: 180px; background: #090d16; border-radius: 16px; overflow-y: auto; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5); font-family: 'Courier New', Courier, monospace;">
                            <span class="text-muted opacity-50 text-center m-auto font-monospace w-100" id="placeholder-log">
                                <i class="bi bi-hourglass-split me-1"></i> Aguardando comando...
                            </span>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
