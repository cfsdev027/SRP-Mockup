<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Controle de Ponto - Autenticação</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="ponto.css">
    </head>
    <body>
        <main class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                    <section id="tela-login" class="secao-tela">
                        <div class="text-center">
                            <h2 class="titulo-login">REGISTRO DE PONTO</h2>
                        </div>
                        <div id="alerta-erro" class="alert alert-danger rounded-4 mb-4" role="alert" hidden>
                            <div class="d-flex align-items-center">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <div>Usuário ou senha incorretos!</div>
                            </div>
                        </div>
                        <form id="form-login" novalidate class="d-grid gap-4">
                            <div class="grupo-input-custom">
                                <div class="icone-capsula">
                                    <i class="bi bi-person"></i>
                                </div>
                                <input type="text" class="input-invisivel" id="usuario" placeholder="Usuário" required>
                            </div>
                            <div class="grupo-input-custom flex-row-reverse">
                                <div class="icone-capsula">
                                    <i class="bi bi-lock"></i>
                                </div>
                                <input type="password" class="input-invisivel" id="senha" placeholder="Senha" required>
                            </div>
                            <button type="submit" class="btn btn-autenticar shadow">
                            Autenticar
                            </button>
                        </form>
                    </section>
                    <section id="tela-ponto" class="secao-tela card-custom-ponto p-4" style="background: #ffffff; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
                        <div class="punch-card">
                            <div class="user-header">
                                <div class="user-info">
                                    <div id="username-view" class="user-name"></div>
                                    <div class="user-doc"><span id='document-type-view'></span>:&nbsp<span id="document-view"></span></div>
                                </div>
                                <button class="btn-logout" onclick="efetuarLogout()">
                                <i class="bi bi-box-arrow-right"></i> Sair
                                </button>
                            </div>
                            <div class="server-time-box">
                                <div class="server-time-title">Horário Oficial do Servidor</div>
                                <div id="relogio" class="server-time-clock">00:00:00</div>
                                <div id="data-atual" class="server-time-date">...</div>
                            </div>
                            <div class="punch-actions">
                                <button id="btn-entrada" class="btn-punch btn-entry" onclick="registrarPonto('ENTRADA')">
                                <i class="bi bi-play-fill"></i> Entrada
                                </button>
                                <button id="btn-saida" class="btn-punch btn-exit" onclick="registrarPonto('SAIDA')" disabled>
                                <i class="bi bi-stop-fill"></i> Saída
                                </button>
                            </div>
                            <div class="evidence-section">
                                <div class="evidence-title">Evidência de Registro (Trilha)</div>
                                <div id="console-ponto" class="terminal-log">
                                    <div id="placeholder-log" style="color: #64748b; font-style: italic; font-size: 0.85rem;">
                                        Nenhum ponto registrado nesta sessão.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="app.js"></script>
    </body>
</html>
