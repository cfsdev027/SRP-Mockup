<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ponto</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="ponto.css">
</head>
<body>

    <div class="punch-card">
        <div class="user-header">
            <div class="user-info">
                <div class="user-name">Caio Fischer</div>
                <div class="user-doc">CPF: 123.***.***-00</div>
            </div>
            <button class="btn-logout" onclick="window.location.href='login.html'">
                <i class="bi bi-box-arrow-right"></i> Sair
            </button>
        </div>

        <div class="server-time-box">
            <div class="server-time-title">Horário Oficial do Servidor</div>
            <div class="server-time-clock">16:00:48</div>
            <div class="server-time-date">quarta-feira, 6 de maio de 2026</div>
        </div>

        <div class="punch-actions">
            <button class="btn-punch btn-entry">
                <i class="bi bi-play-fill"></i> Entrada
            </button>
            <button class="btn-punch btn-exit">
                <i class="bi bi-stop-fill"></i> Saída
            </button>
        </div>

        <div class="evidence-section">
            <div class="evidence-title">Evidência de Registro (Trilha)</div>
            <div class="terminal-log">
                
                <div class="log-item">
                    <div class="log-header-line">
                        <span class="log-time">[16:00:41]</span>
                        <span class="log-status status-entry">ENTRADA CONFIRMADA</span>
                    </div>
                    <div class="log-details">Trilha: IP 177.42.11.89 | Sessão vinculada ao CPF</div>
                </div>

                <div class="log-item">
                    <div class="log-header-line">
                        <span class="log-time">[16:00:44]</span>
                        <span class="log-status status-exit">SAÍDA CONFIRMADA</span>
                    </div>
                    <div class="log-details">Trilha: Log de Auditoria fechado e selado no servidor</div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
